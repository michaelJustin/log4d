name: Compile ConsoleApp

on:
  push:
    branches: [ master ]
    paths:
      - 'src/main/Log4D.pas'
      - '.github/workflows/compile-consoleapp-linux.yml'
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-slim

    steps:
    - uses: actions/checkout@v6.0.3

    - name: Install Free Pascal Compiler
      run: |
        sudo apt-get install -y fp-compiler

    - name: Verify FPC installation
      run: |
        fpc -iV

    - name: Compile ConsoleApp
      run: |
        cd src/test
        fpc -Fu../main -Mdelphi ConsoleApp.lpr









        
