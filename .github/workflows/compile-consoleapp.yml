name: Compile ConsoleApp

on:
  push:
    branches: [ master, main ]
    paths:
      - 'src/test/ConsoleApp.lpr'
      - 'src/**'
      - '.github/workflows/compile-consoleapp.yml'
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6.0.3

    - name: Install Free Pascal Compiler
      run: |
        choco install lazarus --version=4.0.0 -y

    - name: Verify FPC installation
      run: |
        $env:PATH = "C:\lazarus\fpc\3.2.2\bin\x86_64-win64;$env:PATH"
        fpc -iV

    - name: Compile ConsoleApp
      run: |
        $env:PATH = "C:\lazarus\fpc\3.2.2\bin\x86_64-win64;$env:PATH"
        cd src/test
        fpc -Fu../main ConsoleApp.lpr









        
